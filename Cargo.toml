[package]
name = "clotho"
version = "1.1.0"
edition = "2024"

[dependencies]
backon = "1.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wyhash = "0.6.0"
arc-swap = "1.9"
dashmap = "7.0.0-rc2"
boxcar = "0.2.14"
